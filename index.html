<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161616;
    --navy: #22365f;
    --soft: #5e5e5e;
    --edge: rgba(22, 22, 22, .12);
    --glass: rgba(255, 255, 255, .58);
    --accent: #3a3a3a;
    --accent-deep: #1f1f1f;
    --on-ink: #f0f0ef;
    --sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html.lerp { scroll-behavior: auto; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 400 16.5px/1.7 var(--sans); -webkit-font-smoothing: antialiased;
    background-color: #ececeb;
    background-image:
      radial-gradient(900px 580px at 92% -8%, rgba(255, 255, 255, .85), transparent 64%),
      radial-gradient(860px 620px at 2% -10%, rgba(196, 196, 194, .55), transparent 64%),
      radial-gradient(900px 500px at 50% 112%, rgba(255, 255, 255, .6), transparent 66%),
      linear-gradient(165deg, #f3f3f2 0%, #e4e4e2 48%, #efefed 100%);
    background-repeat: no-repeat;
  }
  a { color: var(--accent-deep); text-decoration: underline; text-decoration-color: rgba(31, 31, 31, .35); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--accent-deep); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  ::selection { background: var(--ink); color: var(--on-ink); }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes drop { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 30; background: rgba(238, 238, 236, .8); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--edge); animation: drop .7s var(--ease) both; }
  .bar-in { max-width: 980px; margin: 0 auto; padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); font: 500 14.5px/1 var(--sans); text-decoration: none; }
  .brand span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mark { display: none; flex: none; width: 14px; height: 14px; border-radius: 4px; background: #3a3a3a; box-shadow: 0 0 0 3px rgba(58, 58, 58, .18); }
  .gh { flex: none; padding: 7px 13px; border: 1px solid var(--edge); border-radius: 999px; background: rgba(255, 255, 255, .6); color: var(--ink); font: 500 13.5px/1 var(--sans); text-decoration: none; transition: border-color .2s, box-shadow .2s; }
  .gh:hover { border-color: var(--accent); box-shadow: 0 6px 18px -10px rgba(58, 58, 58, .7); }

  /* hero */
  .hero { max-width: 980px; margin: 0 auto; padding: 84px 32px 44px; }
  .byline { margin: 0 0 22px; font: 500 14.5px/1.4 var(--sans); color: var(--soft); --d: .08s; animation: rise .8s var(--ease) both; animation-delay: var(--d); }
  h1 {
    margin: 0 0 24px; font: 600 clamp(2.6rem, 7.2vw, 5rem)/1.02 var(--sans); letter-spacing: -.05em;
    color: var(--ink);
    animation: rise .8s var(--ease) .16s both;
  }
  .lede { margin: 0 0 40px; font-size: clamp(1.05rem, 1.7vw, 1.2rem); line-height: 1.55; color: var(--soft); animation: rise .8s var(--ease) .28s both; }
  .ask { width: 100%; padding: 16px 18px 14px; border: 1px solid var(--edge); border-radius: 10px;
    background: #fbfbfa;
    box-shadow: 0 1px 2px rgba(22, 22, 22, .05), 0 24px 50px -26px rgba(22, 22, 22, .35);
    animation: rise .8s var(--ease) .4s both; transition: box-shadow .3s, transform .3s; }
  .ask:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(22, 22, 22, .05), 0 30px 60px -26px rgba(58, 58, 58, .55); }
  .ask-label { margin: 0 0 8px; font: 500 13.5px/1 var(--sans); color: var(--soft); }
  .ask-text { margin: 0; min-height: 3.6em; font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.45; letter-spacing: -.015em; }
  .caret { display: inline-block; width: 2px; height: 1.1em; margin-left: 2px; vertical-align: -.18em; background: var(--accent); animation: blink 1.05s steps(1) infinite; }
  .ask-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .go { display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font: 500 14px/1 var(--sans); text-decoration: none; transition: transform .2s, background .2s, color .2s; }
  .go:hover { background: var(--accent); color: #fff; transform: translateY(-1px); }

  /* floating dock */
  @keyframes dockin { from { opacity: 0; transform: translate(-50%, 28px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .dock { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; display: flex; gap: 2px; max-width: calc(100vw - 20px); padding: 6px; overflow-x: auto; scrollbar-width: none; border-radius: 999px;
    background: rgba(255, 255, 255, .6); -webkit-backdrop-filter: blur(22px) saturate(1.7); backdrop-filter: blur(22px) saturate(1.7); border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 1px 0 rgba(255, 255, 255, .8) inset, 0 20px 50px -14px rgba(22, 22, 22, .38), 0 2px 10px rgba(22, 22, 22, .08); animation: dockin .8s var(--ease) .6s both; }
  .dock::-webkit-scrollbar { display: none; }
  .tab { position: relative; z-index: 1; flex: none; display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-radius: 999px; color: var(--soft); font: 500 14px/1.2 var(--sans); text-decoration: none; white-space: nowrap; transition: color .25s; }
  .tab svg { width: 22px; height: 22px; flex: none; }
  .tab .lbl { display: none; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); }
  .ind { position: absolute; z-index: 0; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 999px; background: rgba(22, 22, 22, .09); box-shadow: 0 0 0 1px rgba(255, 255, 255, .5) inset; }
  .ind.ready { transition: transform .45s var(--ease), width .45s var(--ease); }
  @media (min-width: 760px) { .tab { padding: 11px 16px; } .tab .lbl { display: inline; } }

  /* panels */
  .page { max-width: 980px; margin: 0 auto; padding: 32px 32px 40px; min-height: 60vh; display: flex; flex-direction: column; gap: 28px; }
  section { scroll-margin-top: 84px; }
  .msg { color: var(--soft); }
  .msg code { color: var(--ink); }
  .panel { width: 100%; padding: 38px 42px 26px; background: radial-gradient(520px 260px at 0% 0%, rgba(196, 196, 194, .32), transparent 70%), radial-gradient(520px 260px at 100% 100%, rgba(255, 255, 255, .5), transparent 70%), linear-gradient(160deg, rgba(255, 255, 255, .8), rgba(246, 246, 245, .6) 60%, rgba(232, 232, 230, .55)); border: 1px solid rgba(255, 255, 255, .8); border-radius: 22px; outline-offset: 6px;
    box-shadow: 0 0 0 1px var(--edge), 0 40px 70px -48px rgba(22, 22, 22, .4); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .panel:focus { outline: none; }
  .panel, .hero { transform-origin: 50% 0; will-change: scale, opacity; }
  .panel { transition: box-shadow .4s var(--ease), transform .4s var(--ease), border-color .4s; }
  .panel:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 1); box-shadow: 0 0 0 1px rgba(22, 22, 22, .16), 0 34px 60px -26px rgba(22, 22, 22, .42), 0 10px 22px -12px rgba(22, 22, 22, .18); }
  h2 { margin: 0 0 22px; font: 600 clamp(1.6rem, 3vw, 2.1rem)/1.15 var(--sans); letter-spacing: -.035em; }
  h3 { margin: 30px 0 8px; font: 600 16px/1.35 var(--sans); letter-spacing: -.01em; }
  h4 { margin: 20px 0 6px; font: 600 15px/1.35 var(--sans); color: var(--soft); }
  p { margin: 0 0 16px; }
  ul, ol { margin: 0 0 18px; padding-left: 1.3em; }
  li { margin-bottom: 6px; padding-left: 4px; }
  li::marker { color: var(--accent); }
  strong { font-weight: 600; }
  code { padding: 2px 6px; border-radius: 6px; background: rgba(22, 22, 22, .06); font: 400 .86em var(--mono); }
  pre { margin: 0 0 18px; padding: 16px 18px; overflow-x: auto; border-radius: 12px; background: #1b1b1b; color: #ececec; font: 400 13.5px/1.7 var(--mono); }
  pre code { padding: 0; background: none; font-size: inherit; }

  dl { margin: 0 0 18px; border-top: 1px solid var(--edge); }
  .row { display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 12px 0; border-bottom: 1px solid var(--edge); }
  dt { font: 500 14.5px/1.7 var(--sans); color: var(--soft); }
  dd { margin: 0; }

  figure { margin: 28px 0; }
  figure img { display: block; width: 100%; height: auto; border: 1px solid var(--edge); border-radius: 12px; background: #fff; transition: transform .3s var(--ease), box-shadow .3s; }
  figure img:hover { transform: translateY(-3px); box-shadow: 0 22px 40px -24px rgba(58, 58, 58, .6); }
  figure .ph { display: none; aspect-ratio: 16 / 8; place-items: center; border: 1px dashed rgba(22, 22, 22, .28); border-radius: 12px; background: rgba(255, 255, 255, .4); color: var(--soft); font: 400 14.5px var(--sans); }
  figure.missing img { display: none; }
  figure.missing .ph { display: grid; }
  figcaption { margin-top: 10px; max-width: 56ch; font-size: 14px; line-height: 1.5; color: var(--soft); }

  table { width: 100%; margin: 24px 0 18px; border-collapse: collapse; font-size: 15px; line-height: 1.4; }
  th { padding: 10px 12px 10px 0; text-align: left; font: 600 14.5px/1.4 var(--sans); color: var(--soft); border-bottom: 1px solid var(--ink); }
  td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--edge); }
  .n { text-align: right; font-variant-numeric: tabular-nums; padding-right: 0; }
  caption { caption-side: bottom; padding-top: 10px; text-align: left; font-size: 14px; color: var(--soft); }

  .note { margin: 26px 0 14px; padding: 4px 22px 6px; border-left: 3px solid var(--accent); background: rgba(58, 58, 58, .09); border-radius: 0 12px 12px 0; }
  .note h3:first-child { margin-top: 18px; }

  .pager { display: flex; justify-content: flex-end; gap: 12px; margin: 36px 0 10px; padding-top: 22px; border-top: 1px solid var(--edge); }
  .pg { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border: 1px solid var(--edge); border-radius: 14px; background: linear-gradient(160deg, rgba(255, 255, 255, .85), rgba(236, 236, 234, .7)); color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: transform .25s var(--ease), border-color .25s, box-shadow .25s; }
  .pg:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 12px 26px -14px rgba(58, 58, 58, .7); }
  .pg.next { margin-left: auto; text-align: right; }
  .pg small { display: block; font: 500 12.5px/1.3 var(--sans); color: var(--soft); }
  .pg b { display: block; font: 500 15px/1.35 var(--sans); }

  .rv { opacity: 0; transform: translateY(18px); transition: opacity .9s var(--ease), transform .9s var(--ease); transition-delay: var(--dl, 0s); will-change: opacity, transform; }
  .rv.in { opacity: 1; transform: none; }
  .progress { position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; transform-origin: 0 50%; transform: scaleX(0); background: #2e2e2e; will-change: transform; }

  footer { max-width: 980px; margin: 0 auto; padding: 24px 32px 120px; border-top: 1px solid var(--edge); font-size: 14px; color: var(--soft); }

  /* idle hint: after a few seconds without scrolling, the next-step button nudges */
  @keyframes bob { 0%, 55%, 100% { transform: translateY(0); } 15%, 40% { transform: translateY(5px); } 28% { transform: translateY(0); } }
  @keyframes ring { 0%, 55%, 100% { box-shadow: 0 0 0 0 rgba(22, 22, 22, 0); } 20% { box-shadow: 0 0 0 6px rgba(22, 22, 22, .12); } }
  .nudge svg { animation: bob 2.6s ease-in-out infinite; }
  .nudge { animation: ring 2.6s ease-in-out infinite; }
  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr; gap: 2px; }
    .panel { padding: 26px 22px 18px; }
  }
  @media (max-width: 560px) {
    .bar-in, .hero, .page, footer { padding-left: 18px; padding-right: 18px; }
    .hero { padding-top: 56px; }
    body { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <a class="brand" href="#"><span class="mark" aria-hidden="true"></span><span id="brand">Project</span></a>
    <a class="gh" href="https://github.com/Ghifariyadi/team-steam">GitHub</a>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
</div>

<header class="hero">
  <p class="byline" id="byline" hidden></p>
  <h1 id="title">Loading…</h1>
  <p class="lede" id="lede" hidden></p>
  <div class="ask" id="ask" hidden>
    <p class="ask-label">Research question</p>
    <p class="sr" id="ask-full"></p>
    <p class="ask-text" aria-hidden="true"><span id="ask-typed"></span><span class="caret"></span></p>
    <div class="ask-foot">
      <a class="go" id="go" href="#main">Read the project
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="page" id="main"><p class="msg">Loading content…</p></main>

<nav class="dock" id="tabs" aria-label="Sections"><span class="ind" id="ind" aria-hidden="true"></span></nav>

<footer>Built from <code>content.md</code> in the <a href="https://github.com/Ghifariyadi/team-steam">team-steam repository</a>. Edit that file to update this page.</footer>

<script>
/*MD-START*/
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function safeUrl(u) {
  u = u.trim();
  return /^(https?:\/\/|mailto:|#)/i.test(u) || /^[\w\-./%]+$/.test(u) ? u : '#';
}

function inline(s) {
  var codes = [];
  s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) { return '<a href="' + safeUrl(u) + '">' + t + '</a>'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[\s(])_([^_\s][^_]*)_/g, '$1<em>$2</em>');
  s = s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + esc(codes[i]) + '</code>'; });
  return s;
}

var RE_LIST = /^\s*(?:[-*]|\d+\.)\s+(.*)$/;
var RE_IMG = /^!\[(.*)\]\(([^)\s]+)\)\s*$/;
var RE_SEP = /^\s*\|?\s*:?-{2,}[\s:|-]*\|?\s*$/;

function isSpecial(l) {
  return /^(#{3,4})\s/.test(l) || /^```/.test(l) || /^:::/.test(l) || RE_LIST.test(l) || RE_IMG.test(l) || /^\s*\|/.test(l);
}

function cells(r) {
  return r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
}

function blocks(lines) {
  var out = [], i = 0, m;
  while (i < lines.length) {
    var l = lines[i];
    if (!l.trim()) { i++; continue; }

    if (/^```/.test(l)) {
      var code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
      continue;
    }
    if (/^:::note\s*$/.test(l)) {
      var inner = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) { inner.push(lines[i]); i++; }
      i++;
      out.push('<div class="note">' + blocks(inner) + '</div>');
      continue;
    }
    if ((m = l.match(/^(#{3,4})\s+(.*)$/))) {
      var lv = m[1].length;
      out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>');
      i++; continue;
    }
    if ((m = l.match(RE_IMG))) {
      out.push('<figure><img src="' + safeUrl(m[2]) + '" alt="' + esc(m[1]).replace(/"/g, '&quot;') + '" loading="lazy">' +
        '<div class="ph">Figure not added yet</div><figcaption>' + inline(m[1]) + '</figcaption></figure>');
      i++; continue;
    }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && RE_SEP.test(lines[i + 1])) {
      var head = cells(l), al = cells(lines[i + 1]).map(function (c) { return /-:$/.test(c) ? ' class="n"' : ''; });
      var rows = []; i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      var cap = '';
      if (i < lines.length && (m = lines[i].match(/^Table:\s*(.*)$/))) { cap = '<caption>' + inline(m[1]) + '</caption>'; i++; }
      var h = '<table>' + cap + '<thead><tr>' + head.map(function (c, k) { return '<th' + (al[k] || '') + '>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.forEach(function (r) { h += '<tr>' + r.map(function (c, k) { return '<td' + (al[k] || '') + '>' + inline(c) + '</td>'; }).join('') + '</tr>'; });
      out.push(h + '</tbody></table>');
      continue;
    }
    if (RE_LIST.test(l)) {
      var ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length) {
        var lm = lines[i].match(RE_LIST);
        if (lm) { items.push(lm[1]); i++; }
        else if (items.length && /^\s{2,}\S/.test(lines[i])) { items[items.length - 1] += ' ' + lines[i].trim(); i++; }
        else break;
      }
      var kv = items.map(function (t) { return t.match(/^\*\*(.+?):\*\*\s*(.*)$/) || t.match(/^\*\*(.+?)\*\*:\s*(.*)$/); });
      if (!ordered && kv.every(Boolean)) {
        out.push('<dl>' + kv.map(function (k) { return '<div class="row"><dt>' + inline(k[1]) + '</dt><dd>' + inline(k[2]) + '</dd></div>'; }).join('') + '</dl>');
      } else {
        var tag = ordered ? 'ol' : 'ul';
        out.push('<' + tag + '>' + items.map(function (t) { return '<li>' + inline(t) + '</li>'; }).join('') + '</' + tag + '>');
      }
      continue;
    }
    var para = [];
    while (i < lines.length && lines[i].trim() && (para.length === 0 || !isSpecial(lines[i]))) { para.push(lines[i].trim()); i++; }
    out.push('<p>' + inline(para.join(' ')) + '</p>');
  }
  return out.join('');
}

function render(md) {
  md = md.replace(/<!--[\s\S]*?-->/g, '').replace(/\r\n?/g, '\n');
  var lines = md.split('\n'), question = '';

  for (var i = 0; i < lines.length; i++) {
    if (/^>\s?/.test(lines[i])) {
      var s = i, parts = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { parts.push(lines[i].replace(/^>\s?/, '')); i++; }
      question = parts.join(' ').trim();
      lines.splice(s, i - s);
      break;
    }
  }

  var title = '', intro = [], secs = [], cur = null, fence = false;
  lines.forEach(function (l) {
    var m;
    if (/^```/.test(l)) fence = !fence;
    if (!fence) {
      if (!title && (m = l.match(/^#\s+(.*)$/))) { title = m[1].trim(); return; }
      if ((m = l.match(/^##\s+(.*)$/))) { var pt = m[1].split(/\s+\|\s+/); cur = { title: pt[0].trim(), short: (pt[1] || '').trim(), lines: [] }; secs.push(cur); return; }
    }
    (cur ? cur.lines : intro).push(l);
  });

  var introParas = intro.join('\n').split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
  var used = {}, nav = [], html = '';
  secs.forEach(function (sec) {
    var id = sec.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section', n = 2, base = id;
    while (used[id]) { id = base + '-' + n++; }
    used[id] = 1;
    nav.push({ id: id, title: sec.title, short: sec.short });
    html += '<section id="' + id + '"><h2>' + inline(sec.title) + '</h2>' + blocks(sec.lines) + '</section>';
  });
  return { title: title, byline: introParas[0] || '', lede: introParas[1] || '', question: question, nav: nav, html: html };
}
/*MD-END*/

if (typeof document !== 'undefined') {
  (function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var $ = function (id) { return document.getElementById(id); };
    var main = $('main'), tabsEl = $('tabs'), ind = $('ind'), prog = $('progress');
    var jump = reduce ? 'instant' : 'smooth';
    var ICONS = [
      ['question', '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>'],

      var d = render(md);
      if (d.title) { document.title = d.title; $('title').textContent = d.title; $('brand').textContent = d.title; }
      if (d.byline) { $('byline').innerHTML = inline(d.byline); $('byline').hidden = false; }
      if (d.lede) { $('lede').innerHTML = inline(d.lede); $('lede').hidden = false; }
      if (d.question) {
        $('ask').hidden = false;
        $('ask-full').textContent = d.question;
        setTimeout(function () { typeInto($('ask-typed'), d.question); }, reduce ? 0 : 700);
      }

      main.innerHTML = d.html;
      var secs = [].slice.call(main.querySelectorAll('section')), tabs = [], cur = -1, locked = false, lockTimer, ticking = false;

      [].forEach.call(main.querySelectorAll('figure img'), function (img) {
        function miss() { img.parentNode.classList.add('missing'); }
        img.addEventListener('error', miss);
        if (img.complete && img.naturalWidth === 0) miss();
      });

      function place() {
        var t = tabs[cur];
        if (!t) return;
        ind.style.width = t.offsetWidth + 'px';
        ind.style.transform = 'translateX(' + t.offsetLeft + 'px)';
      }

      function setActive(k) {
        if (k === cur) return;
        var first = cur === -1;
        cur = k;
        tabs.forEach(function (t, j) {

      }

      function fx() {

        }
        panels.forEach(function (el) {
          var r = el.getBoundingClientRect();
          var enter = Math.min(1, Math.max(0, (r.top - vh * .55) / (vh * .45)));

      }

        var a = document.createElement('a');
        a.className = 'tab'; a.href = '#' + n.id; a.title = n.title; a.setAttribute('aria-label', n.title);

          var b = document.createElement('button');
          b.type = 'button'; b.className = 'pg next';
          b.innerHTML = '<span><small>Next</small><b>' + esc(d.nav[i + 1].title) + '</b></span>' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';

      requestAnimationFrame(function () { place(); requestAnimationFrame(function () { ind.classList.add('ready'); }); });
      var h0 = decodeURIComponent(location.hash.slice(1)), k0 = d.nav.findIndex(function (n) { return n.id === h0; });
      if (k0 >= 0) setTimeout(function () { go(k0, true); }, 60); else spy();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    }).catch(function () {
      main.innerHTML = '<p class="msg">Could not load <code>content.md</code>. If you opened this file straight from your computer, run <code>python3 -m http.server</code> in this folder and open <code>http://localhost:8000</code> instead.</p>';
      $('title').textContent = 'Project website';
    });
  })();
}
